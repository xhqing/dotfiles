# 仓库内路径 → 系统目标路径 的映射表（install.sh / check.sh 共用）
#
# 格式：仓库内相对路径 <TAB> 系统目标路径 <TAB> 权限 <TAB> 说明
#   - 权限写三位八进制（如 600），不需要就写 -
#   - 说明只给人看，脚本忽略
#   - 以 # 开头的行、空行都会被跳过
#
# 新增一个 App 的配置时，在这里加一行、把文件放进对应目录、再在该目录写 README。
# 注意：物理文件只存一份。多个 App 读同一个文件的，放在「主要归属」的 App 目录，
# 并在该目录 README 与根 README 的「配置文件归属」表里注明（当前没有跨 App 共用项）。

ghostty/config	~/.config/ghostty/config	-	只有 Ghostty 读（cmux 自 v0.65.2.2-r21 起只读 ~/.config/cmux/config.ghostty）
cmux/cmux.json	~/.config/cmux/cmux.json	600	cmux 应用设置（设置界面读它、也会写回它）
cmux/config.ghostty	~/.config/cmux/config.ghostty	-	cmux 自己的终端配置（Ghostty 语法，只有 cmux 读；r21 起 cmux 不再读 ghostty/config）
